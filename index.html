    <script>
      // Ensure window.fetch is writable if a polyfill or iframe environment defines it as getter-only
      try {
        const origFetch = window.fetch;
        let currentFetch = origFetch ? origFetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return currentFetch;
          },
          set(fn) {
            currentFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback: no-op if window.fetch cannot be reconfigured
      }
    </script>
